# Раздача статического экспорта Next.js (output: 'export') на порту 3000.
server {
    listen 0.0.0.0:3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    server_tokens off;

    # Проверка живости контейнера
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Обратный прокси к FastAPI: браузер обращается к своему origin (/backend/...), поэтому CORS не нужен.
    # Адрес должен совпадать с NEXT_PUBLIC_API_URL, с которым собрано приложение.
    location /backend/ {
        proxy_pass https://container-app-pp1pi-raise.containerapps.ru/;
        proxy_ssl_server_name on;
        proxy_set_header Host container-app-pp1pi-raise.containerapps.ru;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 10s;
        # LLM отвечает не мгновенно: даём бэкенду время, иначе браузер увидит 504.
        proxy_read_timeout 60s;
        proxy_send_timeout 30s;
    }

    # Файлы с хешем в имени можно кешировать навсегда
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Страницы: /shushary отдаёт shushary.html, как при next export
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/index.html =404;
    }

    error_page 404 /404.html;
}
