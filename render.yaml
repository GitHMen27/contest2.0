services:
  - type: web
    name: wb-dispatcher-ai
    runtime: python
    plan: free
    rootDir: ai-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      # Секреты: значения вводятся в панели Render, в git их нет.
      - key: DATABASE_URL
        sync: false
      - key: CLOUD_API_KEY
        sync: false
      - key: APP_API_KEY
        sync: false
      # Адрес сайта на Vercel, например https://your-site.vercel.app
      - key: CORS_ORIGINS
        sync: false
      # Точный id чат-модели из каталога Cloud.ru (python check_chat.py --list)
      - key: CLOUD_CHAT_MODEL
        sync: false
      - key: LLM_PROVIDER
        value: cloudru
      - key: EMBEDDING_PROVIDER
        value: cloudru
      - key: CLOUD_EMBEDDING_MODEL
        value: ai-sage/Giga-Embeddings-instruct-480M
      - key: RATE_LIMIT_PER_MINUTE
        value: "30"
      # Вход на сайт и роли. Пароли и секрет задаются в панели Render (sync: false), в git их нет.
      - key: AUTH_SECRET
        sync: false
      - key: AUTH_ADMIN_USERNAME
        value: admin
      - key: AUTH_ADMIN_PASSWORD
        sync: false
      - key: AUTH_USER_USERNAME
        value: demo
      - key: AUTH_USER_PASSWORD
        sync: false
